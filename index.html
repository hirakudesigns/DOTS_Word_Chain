<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ドット絵ギャラリー & 保存アプリ</title>
    <style>
        /* 基本スタイル */
        body {
            font-family: sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1, h2 {
            color: #333;
        }

        /* キャンバスエリア */
        .editor-section {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        canvas {
            border: 2px solid #333;
            image-rendering: pixelated; /* ドット絵のぼやけ防止 */
            background-color: #ffffff;
            cursor: crosshair;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        /* ギャラリーエリア */
        .gallery-section {
            width: 100%;
            max-width: 900px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .gallery-item {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 8px;
            background: #fafafa;
            text-align: center;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .gallery-item .date {
            font-size: 11px;
            color: #666;
            margin-top: 5px;
        }

        /* ローディング / メッセージ表示 */
        #status-message {
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>ドット絵エディタ & ギャラリー</h1>

    <!-- 1. ドット絵作成・送信エリア -->
    <section class="editor-section">
        <canvas id="pixel-canvas" width="16" height="16" style="width: 256px; height: 256px;"></canvas>
        <div class="controls">
            <button id="clear-btn">クリア</button>
            <button id="save-btn">ドライブへ保存</button>
        </div>
        <div id="status-message"></div>
    </section>

    <!-- 2. ギャラリー表示エリア -->
    <section class="gallery-section">
        <h2>みんなのギャラリー</h2>
        <button id="reload-btn">ギャラリーを更新</button>
        <div id="gallery-container" class="gallery-grid">
            <!-- 動的に画像が追加されます -->
        </div>
    </section>

    <script>
        // ==========================================
        // 設定: デプロイしたGASのWebアプリURLを入力
        // ==========================================
        const GAS_API_URL = "YOUR_GAS_DEPLOY_URL_HERE";

        // DOM要素の取得
        const canvas = document.getElementById('pixel-canvas');
        const ctx = canvas.getContext('2d');
        const saveBtn = document.getElementById('save-btn');
        const clearBtn = document.getElementById('clear-btn');
        const reloadBtn = document.getElementById('reload-btn');
        const statusMessage = document.getElementById('status-message');
        const galleryContainer = document.getElementById('gallery-container');

        // 簡易お絵かき機能の初期化 (16x16)
        let isDrawing = false;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        canvas.addEventListener('mousedown', () => isDrawing = true);
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mousemove', draw);

        function draw(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / (rect.width / canvas.width));
            const y = Math.floor((e.clientY - rect.top) / (rect.height / canvas.height));
            
            ctx.fillStyle = '#000000'; // 黒色固定（必要に応じてカラーパレット機能を追加してください）
            ctx.fillRect(x, y, 1, 1);
        }

        // クリアボタン
        clearBtn.addEventListener('click', () => {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            statusMessage.innerText = '';
        });

        // ==========================================
        // 1. GASへドット絵を保存する処理 (POST)
        // ==========================================
        saveBtn.addEventListener('click', async () => {
            if (GAS_API_URL === "YOUR_GAS_DEPLOY_URL_HERE") {
                alert("GAS_API_URL を正しいWebアプリURLに置き換えてください。");
                return;
            }

            saveBtn.disabled = true;
            statusMessage.style.color = '#333';
            statusMessage.innerText = '保存中...';

            // CanvasからBase64形式のPNG画像を抽出
            const base64Image = canvas.toDataURL('image/png');

            try {
                // GASのCORS制約を回避するため Content-Type は text/plain に設定
                const response = await fetch(GAS_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8'
                    },
                    body: JSON.stringify({ image: base64Image })
                });

                const result = await response.json();

                if (result.status === 'success') {
                    statusMessage.style.color = 'green';
                    statusMessage.innerText = '保存完了！';
                    // ギャラリーを再読込
                    loadTitleGallery();
                } else {
                    throw new Error(result.message || '保存に失敗しました');
                }
            } catch (error) {
                console.error('保存エラー:', error);
                statusMessage.style.color = 'red';
                statusMessage.innerText = '保存エラー: ' + error.message;
            } finally {
                saveBtn.disabled = false;
            }
        });

        // ==========================================
        // 2. ギャラリー画像の一覧を取得する処理 (GET)
        // ==========================================
        async function loadTitleGallery() {
            if (GAS_API_URL === "YOUR_GAS_DEPLOY_URL_HERE") return;

            galleryContainer.innerHTML = '<p>読み込み中...</p>';

            try {
                const response = await fetch(GAS_API_URL, { method: 'GET' });
                const data = await response.json();

                galleryContainer.innerHTML = '';

                if (Array.isArray(data) && data.length > 0) {
                    // 最新の投稿が上にくるように逆順表示
                    data.reverse().forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'gallery-item';

                        const img = document.createElement('img');
                        img.src = item.url;
                        img.alt = item.filename || 'ドット絵';
                        img.loading = 'lazy';

                        const date = document.createElement('div');
                        date.className = 'date';
                        date.innerText = item.timestamp ? new Date(item.timestamp).toLocaleDateString() : '';

                        card.appendChild(img);
                        card.appendChild(date);
                        galleryContainer.appendChild(card);
                    });
                } else {
                    galleryContainer.innerHTML = '<p>まだ画像はありません。</p>';
                }
            } catch (error) {
                console.error('ギャラリー取得エラー:', error);
                galleryContainer.innerHTML = '<p>画像の取得に失敗しました。</p>';
            }
        }

        // リロードボタンの処理
        reloadBtn.addEventListener('click', loadTitleGallery);

        // ページ読み込み時にギャラリーを表示
        window.addEventListener('DOMContentLoaded', loadTitleGallery);
    </script>
</body>
</html>
